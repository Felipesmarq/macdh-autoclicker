[project]
name = "macdh-autoclicker"
version = "0.1.0"
description = "Auto clicker personalizável com hotkeys editáveis pela interface"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7",
]

[project.scripts]
autoclicker = "autoclicker.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoclicker"]
